 <!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Finder</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            padding: 60px 0;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #999;
            margin-bottom: 35px;
        }

        .search-box {
            background: #1c1c1c;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 25px;
        }

        textarea {
            width: 100%;
            min-height: 110px;
            resize: vertical;
            background: #111;
            border: 1px solid #444;
            border-radius: 10px;
            color: white;
            padding: 15px;
            font-size: 16px;
            outline: none;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        input {
            width: 150px;
            padding: 12px;
            background: #111;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
        }

        button {
            margin-top: 20px;
            padding: 14px 25px;
            border: none;
            border-radius: 9px;
            background: white;
            color: black;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #ccc;
        }

        #results {
            margin-top: 35px;
        }

        .stats {
            background: #1c1c1c;
            border: 1px solid #333;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .bibliography-box {
            background: #1c1c1c;
            border: 1px solid #333;
            padding: 28px;
            border-radius: 12px;
        }

        .bibliography-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .citation {
            padding: 18px 0;
            border-bottom: 1px solid #333;
            line-height: 1.65;
            font-size: 16px;
        }

        .citation:last-child {
            border-bottom: none;
        }

        .citation-actions {
            margin-top: 9px;
        }

        .citation-actions a {
            color: #aaa;
            text-decoration: none;
            font-size: 13px;
        }

        .citation-actions a:hover {
            color: white;
            text-decoration: underline;
        }

        .match {
            display: inline-block;
            margin-left: 12px;
            color: #aaa;
            font-size: 12px;
        }

        .empty {
            background: #1c1c1c;
            border: 1px solid #333;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            color: #aaa;
        }

        .copy-button {
            margin-top: 0;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Research Finder</h1>

    <div class="subtitle">
        Пошук безкоштовних академічних джерел
    </div>

    <div class="search-box">

        <textarea
            id="query"
            placeholder="Введіть тему курсової або магістерської роботи..."
        ></textarea>

        <div class="filters">

            <input
                id="yearFrom"
                type="number"
                value="2015"
                placeholder="Рік від"
            >

            <input
                id="yearTo"
                type="number"
                value="2026"
                placeholder="Рік до"
            >

        </div>

        <button onclick="searchSources()">
            Знайти джерела
        </button>

    </div>

    <div id="results"></div>

</div>


<script>

async function searchSources() {

    const query =
        document.getElementById("query").value.trim();

    const yearFrom =
        document.getElementById("yearFrom").value;

    const yearTo =
        document.getElementById("yearTo").value;

    const resultsContainer =
        document.getElementById("results");


    if (!query) {
        alert("Введіть тему роботи");
        return;
    }


    resultsContainer.innerHTML = `
        <div class="empty">
            Шукаємо джерела...
        </div>
    `;


    try {

        const response = await fetch(
            "https://research-finder-7srk.onrender.com/api/search",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    query: query,
                    year_from: Number(yearFrom),
                    year_to: Number(yearTo),
                    limit: 20
                })
            }
        );


        if (!response.ok) {
            throw new Error(
                "Помилка сервера: " + response.status
            );
        }


        const data =
            await response.json();


        if (!data.results ||
            data.results.length === 0) {

            resultsContainer.innerHTML = `
                <div class="empty">
                    Джерел не знайдено.
                    <br><br>
                    Спробуйте змінити тему
                    або діапазон років.
                </div>
            `;

            return;
        }


        const total =
            data.total || data.results.length;


        const scholar =
            data.sources &&
            data.sources.google_scholar
                ? data.sources.google_scholar
                : total;


        let html = `

            <div class="stats">

                <strong>
                    Знайдено джерел: ${total}
                </strong>

                <br><br>

                Google Scholar:
                ${scholar}

            </div>

            <div class="bibliography-box">

                <div class="bibliography-title">
                    Список використаних джерел
                </div>

                <button
                    class="copy-button"
                    onclick="copyBibliography()"
                >
                    Копіювати список
                </button>

        `;


        let bibliographyText = "";


        data.results.forEach(
            (source, index) => {

                const citation =
                    source.bibliography ||
                    source.title ||
                    "Без назви";


                const match =
                    source.match_percent !== undefined
                        ? `<span class="match">
                            Відповідність: ${source.match_percent}%
                           </span>`
                        : "";


                html += `

                    <div class="citation">

                        <strong>
                            ${index + 1}.
                        </strong>

                        ${escapeHtml(citation)}

                        <div class="citation-actions">

                            <a
                                href="${escapeHtml(source.url || "#")}"
                                target="_blank"
                                rel="noopener noreferrer"
                            >
                                Відкрити джерело →
                            </a>

                            ${match}

                        </div>

                    </div>

                `;


                bibliographyText +=
                    `${index + 1}. ${citation}\n`;

            }
        );


        html += `
            </div>
        `;


        resultsContainer.innerHTML = html;


        window.currentBibliography =
            bibliographyText;


    } catch (error) {

        console.error(error);

        resultsContainer.innerHTML = `

            <div class="empty">

                Не вдалося підключитися
                до сервера.

                <br><br>

                ${escapeHtml(error.message)}

            </div>

        `;

    }

}


async function copyBibliography() {

    if (!window.currentBibliography) {
        return;
    }


    try {

        await navigator.clipboard.writeText(
            window.currentBibliography
        );

        alert(
            "Список джерел скопійовано!"
        );

    } catch (error) {

        alert(
            "Не вдалося скопіювати список."
        );

    }

}


function escapeHtml(text) {

    return String(text)

        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
